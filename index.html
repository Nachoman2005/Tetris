<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argentris</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: #76c7f2;
      --ink: #0b1020;
      --light: #eef8ff;
      --gold: #f7c948;
      --green: #5ed5a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, var(--sky) 0 22%, var(--light) 22% 78%, var(--sky) 78% 100%);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 28px;
      border: 3px solid var(--ink);
      background: rgba(238, 248, 255, 0.9);
      box-shadow: 10px 10px 0 var(--ink);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(42px, 9vw, 84px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      font-size: 18px;
      line-height: 1.5;
    }

    .blocks {
      display: grid;
      grid-template-columns: repeat(7, 34px);
      gap: 5px;
      margin-top: 24px;
    }

    .block {
      width: 34px;
      aspect-ratio: 1;
      border: 2px solid var(--ink);
      background: var(--gold);
    }

    .block:nth-child(2n) {
      background: var(--sky);
    }

    .block:nth-child(3n) {
      background: var(--green);
    }
  </style>
</head>
<body>
  <main>
    <h1>Argentris</h1>
    <p>Juego de bloques para Android creado con Godot, inspirado en mate, potrero, tango, dulce de leche y celebracion campeona.</p>
    <p>Sin nombres, rostros, escudos, logos ni marcas reales.</p>
    <div class="blocks" aria-hidden="true">
      <span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span>
      <span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span>
      <span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span>
      <span class="block"></span><span class="block"></span>
    </div>
  </main>
</body>
</html>
